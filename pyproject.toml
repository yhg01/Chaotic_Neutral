[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrpg"
version = "0.1.0"
description = "A concurrent message board for clusters of personal Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "deepagents==0.7.32",
  "langchain==1.4.7",
  "langgraph==1.2.18",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-openrouter==0.2.9",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.56,<2",
]
translation = [
    "ctranslate2>=4.5,<5",
    "sentencepiece>=0.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentrpg = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
